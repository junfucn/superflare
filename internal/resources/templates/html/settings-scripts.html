{{ define "settings-scripts.html" }}<div class="setting-group-container"><form method="POST" action="{{ .SettingPages.Scripts.Path }}"><h2>{{ T .Locale "nav_scripts" }}</h2><div class="form-group"><label for="settings-custom-scripts">{{ T .Locale "custom_scripts_label" }}</label>
<textarea class="option-input" name="custom-scripts" id="settings-custom-scripts" rows="16" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off" aria-describedby="custom-scripts-help custom-scripts-trust" placeholder="{{ T .Locale "custom_scripts_placeholder" }}">{{.OptionCustomScripts}}</textarea><p class="help-text" id="custom-scripts-help">{{ T .Locale "custom_scripts_help" }}<p class="help-text" id="custom-scripts-trust">{{ T .Locale "custom_scripts_trust" }}</div><div class="form-group"><input class="btn-submit" type="submit" value='{{ T .Locale "save_changes" }}'></div></form></div>{{ end }}
